
<html>
<head>
    <title> proste oblicznie </title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color: red; font-size: 50px;">
        <script language="JavaScript">
            var liczba1=prompt("podaj liczbe a=","");
            var a_kop=parseFloat(liczba1);
            var liczba2=prompt("podaj liczbe b=","");
            var b_kop=parseFloat(liczba2);
            var c;
            var d;
            var e;
            var f;
            var g;

           c = a_kop * a_kop * a_kop ;
           d = 3*(a_kop*a_kop)*(b_kop) ;
           e = 3*(a_kop)*(b_kop * b_kop) ;
           f = b_kop * b_kop * b_kop;
           g = c+d+e+f ;

            
            document.write("a="+a_kop+" b=" +b_kop+"<br>"); 
            document.write("("+a_kop+"+" +b_kop+")^3= "+a_kop+"^3 + 3*(("+a_kop+")^2)*("+b_kop+")+ 3*("+a_kop+")*(("+b_kop+")^2) + "+b_kop+"^3 =" +c+ "+" +d+ "+" +e+ "+" +f+ "="+g+"<br><br><br><br><br><br><br><br>"); 
</script>
<input type="button" value="zamknij okno" onclick="okno_zamknij_kopacz()"/>            </div>
</body>
</html>
