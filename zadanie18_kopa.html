<!DOCTYPE html>
 <head>
 <title> Użycie fukcji </title>
 <meta charset="utf-8">
 </head>
<body>
 <div style="color:navy;font-size:50px;">
 <script language="JavaScript">
function zamknijokno() 
{window.close() } 
 var a=parseFloat(prompt("a=",""));
 var b=parseFloat(prompt("b=",""));
 function suma_kop(a, b) {
 return a + b;
 }
 document.write("suma="+suma_kop(a,b)+"<br>");
</script>
</div>
<input type="button" value="zamknij okno" onclick="zamknijokno()"/> 
</body>
</html>
