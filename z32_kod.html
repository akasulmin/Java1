} 
 mebel.prototype.wypisz = function () 
 {
 alert(this.rodzaj + " " + this.kolor+ " " + this.szerokość_mebla);
 };
var mebel_jeden = new mebel("biurko", "białe", "0,75 metra");
var mebel_dwa = new mebel("łóżko", "Czerwone ", "2 metry");

mebel_dwa.wypisz();
