

<html>
<head>
    <title>Obliczanie pola i obwodu prostokąta</title>

    <script language="JavaScript">
        function pole_kopa(a_kopa, b_kopa) {
            a_bla = parseFloat(document.getElementsByName('a_dana_kopa')[0].value);
            b_bla = parseFloat(document.getElementsByName('b_dana_kopa')[0].value);
            var pole_wynik_kopa = a_kopa * b_kopa;
            document.getElementsByName('pole')[0].value = pole_wynik_kopa.toFixed(2);
            alert("Pole = " + pole_wynik_kopa.toFixed(2) + " cm^2");
        }
        function obwod_bla(a_kopa, b_kopa) {
            a_bla = parseFloat(document.getElementsByName('a_dana_kopa')[0].value);
            b_bla = parseFloat(document.getElementsByName('b_dana_kopa')[0].value);
            var obwod_wynik_kopa = 2 * a_kopa + 2 * b_kopa;
            document.getElementsByName('obwod')[0].value = obwod_wynik_kopa.toFixed(2);
            alert("Obwód = " + obwod_wynik_kopa.toFixed(2) + " cm");
        }
    </script>
</head>
<body>
    Obliczanie pola i obwodu prostokąta
    <br><br>
    <form onsubmit="pole_kopa(); obwod_kopa(); return false;">
        Podaj a =
        <input size="6" name="a_dana_kopa">
        Podaj b =
        <input size="6" name="b_dana_kopa">
        <br><br>
        <input type="submit" value="Oblicz">
        <br><br>
        Obwód =
        <input size="6" name="obwod">
        <br><br>
        Pole =
        <input size="6" name="pole">
    </form>
</body>
</html>
